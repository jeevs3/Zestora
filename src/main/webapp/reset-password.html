<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieGo - Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: #fff7f7;

            color: #292936;

            overflow: hidden;
        }


        /* =================================
           PAGE
        ================================= */

        .reset-page {

            height: 100vh;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            overflow: hidden;
        }


        /* =================================
           PINK DECORATION
        ================================= */

        .pink-circle-one {

            position: absolute;

            width: 430px;
            height: 430px;

            background: #f9dfe3;

            border-radius: 50%;

            top: -220px;
            left: -180px;

            opacity: 0.65;
        }


        .pink-circle-two {

            position: absolute;

            width: 400px;
            height: 400px;

            background: #f8cfd8;

            border-radius: 50%;

            right: -180px;
            bottom: -220px;

            opacity: 0.55;
        }


        /* =================================
           DOTS
        ================================= */

        .dots {

            position: absolute;

            width: 70px;
            height: 70px;

            background-image:
                radial-gradient(
                    circle,
                    #ed91a1 2px,
                    transparent 2.5px
                );

            background-size: 18px 18px;

            opacity: 0.5;
        }


        .dots-left {
            left: 8%;
            bottom: 18%;
        }


        .dots-right {
            right: 8%;
            top: 18%;
        }


        /* =================================
           RESET CARD
        ================================= */

        .reset-card {

            width: 410px;

            padding: 42px;

            background: rgba(255,255,255,0.96);

            border-radius: 22px;

            box-shadow:
                0 20px 60px
                rgba(90,56,40,0.14);

            position: relative;

            z-index: 5;
        }


        /* =================================
           LOGO
        ================================= */

        .reset-logo {

            text-align: center;

            font-size: 38px;

            font-weight: 800;

            color: #5a3828;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }


        .reset-logo span {
            color: #ed8295;
        }


        /* =================================
           HEADING
        ================================= */

        .reset-card h1 {

            text-align: center;

            font-size: 26px;

            color: #292936;

            margin-bottom: 9px;
        }


        .reset-subtitle {

            text-align: center;

            color: #80645a;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 28px;
        }


        /* =================================
           INPUT
        ================================= */

        .input-group {

            margin-bottom: 18px;
        }


        .input-group label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #5a3828;

            margin-bottom: 7px;
        }


        .input-group input {

            width: 100%;

            height: 48px;

            border: 1px solid #e4d5d1;

            border-radius: 9px;

            padding: 0 14px;

            outline: none;

            font-size: 14px;

            background: #fffafa;

            transition: 0.25s ease;
        }


        .input-group input:focus {

            border-color: #ed8295;

            box-shadow:
                0 0 0 3px
                rgba(237,130,149,0.12);
        }


        /* =================================
           RESET BUTTON
        ================================= */

        .reset-button {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background: #ed8295;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 4px;

            transition: 0.25s ease;
        }


        .reset-button:hover {

            background: #df7185;

            transform: translateY(-1px);
        }


        /* =================================
           BACK TO LOGIN
        ================================= */

        .back-login {

            display: block;

            text-align: center;

            margin-top: 24px;

            color: #ed8295;

            font-size: 13px;

            font-weight: 700;

            text-decoration: none;
        }


        .back-login:hover {
            text-decoration: underline;
        }


        /* =================================
           BACK HOME
        ================================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 16px;

            color: #8b756c;

            font-size: 12px;

            text-decoration: none;
        }


        .back-home:hover {
            color: #ed8295;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 500px) {

            .reset-card {

                width:
                    calc(100% - 30px);

                padding:
                    35px 25px;
            }


            .reset-logo {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>


    <main class="reset-page">


        <!-- BACKGROUND DECOR -->

        <div class="pink-circle-one"></div>

        <div class="pink-circle-two"></div>

        <div class="dots dots-left"></div>

        <div class="dots dots-right"></div>


        <!-- RESET PASSWORD CARD -->

        <div class="reset-card">


            <!-- LOGO -->

            <div class="reset-logo">
                Foodie<span>GO</span>
            </div>


            <h1>
                Reset your password
            </h1>


            <p class="reset-subtitle">

                Create a new password for
                your FoodieGo account.

            </p>


            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- RESET -->

            <button
                type="button"
                class="reset-button"
            >
                Reset Password
            </button>


            <!-- LOGIN -->

            <a
                href="login.html"
                class="back-login"
            >
                ← Back to Login
            </a>


            <!-- HOME -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to FoodieGo
            </a>


        </div>

    </main>


</body>

</html>
